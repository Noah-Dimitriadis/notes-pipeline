[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-pipeline"
version = "0.1.0"
description = "Ingest a lecture recording, slide deck, and notes; emit one well-formed markdown file per lecture."
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "python-pptx",
    "pypdf",
    "fastmcp",
    "pydantic",
    "pydantic-settings",
    "typer",
]

[project.scripts]
notes = "notes_pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["notes_pipeline*"]
